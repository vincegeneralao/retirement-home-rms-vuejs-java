server:
  port: ${PORT:8080}

spring:
  application:
    name: rms-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:rms_java}
    username: ${DB_USER:rms}
    password: ${DB_PASSWORD:rms_secret_2026}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

rms:
  site-timezone: ${SITE_TIMEZONE:Australia/Brisbane}
  jwt:
    secret: ${JWT_SECRET:dev-only-signing-secret-change-me-please-32-bytes}
    ttl: ${JWT_TTL:8h}
    issuer: retirement-home-rms
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5175}

springdoc:
  api-docs:
    path: /api/docs.json
  swagger-ui:
    path: /api/docs

logging:
  level:
    root: INFO
    com.rms: INFO
