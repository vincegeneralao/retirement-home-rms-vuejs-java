spring:
  datasource:
    url: jdbc:h2:mem:rms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

rms:
  site-timezone: Australia/Brisbane
  jwt:
    secret: test-signing-secret-please-use-at-least-thirty-two-bytes
    ttl: 8h
    issuer: retirement-home-rms

springdoc:
  api-docs:
    path: /api/docs.json
  swagger-ui:
    path: /api/docs
