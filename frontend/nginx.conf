server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxied to the Spring backend, which emits its own security headers
    # (config.SecurityHeadersFilter). Do NOT add_header here: duplicating them on
    # proxied responses would send conflicting values to the browser.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA static assets. add_header in a location replaces the inherited set, so the
    # full header set is declared here.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # The Vite production build ships same-origin external assets only (no inline
        # or eval'd scripts), so a strict script-src is safe.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
